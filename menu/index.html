  --verde: #257C4D;
  --titulo: 'Bebas Marca', 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --texto: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --borde: 3px solid var(--tinta);
  --sombra: 4px 4px 0 var(--tinta);
  --sombra-chica: 2px 2px 0 var(--tinta);
  --radio: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--lienzo); color: var(--tinta); font: 15px/1.5 var(--texto); }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--dorado); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marco { max-width: 1120px; margin: 0 auto; }

/* ---------- portada */
.portada { padding-block: 18px 8px; }
.portada .marco { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; }
.portada .wordmark { height: 46px; width: auto; }
.portada h1 { font-family: var(--titulo); font-weight: 400; font-size: clamp(64px, 17vw, 132px); line-height: .82;
  letter-spacing: .5px; margin: 18px 0 6px; text-wrap: balance; }
.portada h1 .rojo { color: var(--rojo); }
.portada .donde { font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.portada .donde span { color: var(--tinta-2); font-weight: 500; }
/* personaje: 420x663 (alto), nunca se fuerza a cuadrado; entra como estampa y luego se mece */
.personaje { width: clamp(96px, 24vw, 190px); height: auto; aspect-ratio: 420 / 663; margin-bottom: -8px; transform-origin: 50% 100%;
  filter: drop-shadow(4px 4px 0 var(--tinta)); animation: pega .6s cubic-bezier(.2, 1.4, .4, 1) .25s both, mece 4.5s ease-in-out 1s infinite; }
@keyframes pega { from { transform: rotate(-16deg) scale(.4); opacity: 0; } to { transform: rotate(3deg) scale(1); opacity: 1; } }
@keyframes mece { 0%, 100% { transform: rotate(3deg); } 50% { transform: rotate(-2deg) translateY(-3px); } }
/* portada: las lineas del titulo suben una tras otra */
.portada h1 .l { display: inline-block; animation: sube .55s cubic-bezier(.2, .9, .3, 1.15) both; }
.portada h1 .l + br + .l { animation-delay: .12s; }
.portada .donde, .portada .wordmark { animation: sube .5s ease-out .2s both; }
.ahora { animation: entra-lado .6s cubic-bezier(.2, .9, .3, 1.1) .35s both; }
.chip { animation: sube .4s ease-out both; }
@keyframes sube { from { transform: translateY(26px); opacity: 0; } }
@keyframes entra-lado { from { transform: translateX(-30px) rotate(-1.5deg); opacity: 0; } }

/* ---------- franja AHORA (reloj del celular, hora de la sucursal) */
.ahora { margin-top: 18px; background: var(--tinta); color: var(--lienzo); border-radius: var(--radio); border: var(--borde);
  box-shadow: 4px 4px 0 var(--dorado); padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.ahora .reloj { font-family: var(--titulo); font-size: 30px; line-height: 1; color: var(--dorado); font-variant-numeric: tabular-nums; }
.ahora .reloj small { display: block; font: 700 10px/1 var(--texto); letter-spacing: 1.4px; color: var(--crema); text-transform: uppercase; margin-top: 4px; }
.ahora .que { min-width: 0; }
.ahora .que b { display: block; font-size: 15px; }
.ahora .que span { color: var(--crema); font-size: 13px; }
.ahora .ir { font-weight: 800; font-size: 13px; background: var(--dorado); color: var(--tinta); border-radius: 999px; padding: 7px 12px;
  text-decoration: none; border: 2px solid var(--lienzo); white-space: nowrap; }
.punto-vivo { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 3px rgba(37, 124, 77, .35);
  margin-right: 6px; vertical-align: 1px; animation: late 1.6s ease-in-out infinite; }
@keyframes late { 50% { box-shadow: 0 0 0 6px rgba(37, 124, 77, 0); } }

/* ---------- barra de categorias + buscador */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--lienzo); border-bottom: var(--borde); padding-block: 10px; margin-top: 18px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--lienzo); }
.barra .marco { display: flex; gap: 10px; align-items: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px 4px 6px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; font: 800 13px/1 var(--texto); letter-spacing: .4px; text-transform: uppercase; white-space: nowrap; text-decoration: none;
  border: 2px solid var(--tinta); border-radius: 999px; padding: 9px 13px; background: var(--lienzo); box-shadow: var(--sombra-chica);
  transition: transform .12s, box-shadow .12s, background .12s; }
.chip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--tinta); }
.chip[aria-current="true"] { background: var(--dorado); }
.chip.promo { color: var(--rojo); }
.buscar { position: relative; flex: 0 0 auto; }
.buscar input { width: 44px; height: 38px; border: 2px solid var(--tinta); border-radius: 999px; padding: 0 12px 0 36px; font: 600 14px var(--texto);
  color: var(--tinta); background: var(--lienzo); box-shadow: var(--sombra-chica); transition: width .2s; }
.buscar input:focus, .buscar input:not(:placeholder-shown) { width: min(220px, 52vw); outline: none; background: var(--crema); }
.buscar svg { position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; pointer-events: none; }

/* ---------- secciones */
main { padding-block: 8px 40px; }
.seccion { padding-top: 26px; }
.seccion > header { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--tinta); margin-bottom: 14px; }
.seccion h2 { font-family: var(--titulo); font-weight: 400; font-size: 44px; line-height: 1; margin: 0; letter-spacing: .5px; }
.seccion header span { color: var(--tinta-2); font-weight: 700; font-size: 13px; }
.lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }

/* producto: la FOTO manda. Tarjeta vertical 4:5 con contorno y sombra dura; el precio es una estampa roja pegada
   sobre la foto; nombre corto abajo. Descripcion y variantes en la ficha que se abre al tocar. */
.lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; }
.prod { display: block; width: 100%; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--lienzo);
  border: var(--borde); border-radius: 18px; box-shadow: var(--sombra); transition: transform .14s, box-shadow .14s; }
.prod:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--tinta); }
.prod:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tinta); }
.prod .marco-foto { position: relative; }
.prod .foto { aspect-ratio: 4 / 5; border-radius: 15px 15px 0 0; overflow: hidden; background: var(--crema); border-bottom: var(--borde); }
.prod .foto img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.prod:hover .foto img { transform: scale(1.05); }
.estampa { position: absolute; right: -8px; bottom: -14px; transform: rotate(-6deg); background: var(--rojo); color: var(--lienzo);
  font-family: var(--titulo); font-size: 30px; line-height: 1; padding: 6px 10px 4px; border: var(--borde); border-radius: 10px;
  box-shadow: var(--sombra-chica); font-variant-numeric: tabular-nums; }
.prod:nth-child(even) .estampa { transform: rotate(5deg); }
.cinta { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 800 11px/1 var(--texto); letter-spacing: .3px; border: 2px solid var(--tinta); color: var(--tinta); background: var(--lienzo);
  border-radius: 999px; padding: 5px 8px; box-shadow: var(--sombra-chica); }
.tag.vivo { background: var(--dorado); }
.prod .pie { padding: 18px 12px 12px; display: grid; gap: 2px; }
.prod h3 { font-size: 15px; line-height: 1.2; margin: 0; font-weight: 900; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod .otra { font-size: 12px; font-weight: 700; color: var(--tinta-2); }
.prod .elige { font-size: 12px; color: var(--tinta-2); }

/* aparicion al hacer scroll: SOLO las tarjetas que nacen debajo de la pantalla esperan (las de arriba ya se ven) */
.espera { opacity: 0; transform: translateY(28px) rotate(-1.2deg); }
.visto { animation: aparece .55s cubic-bezier(.2, .9, .3, 1.1) both; }
.visto .estampa { animation: golpe .45s cubic-bezier(.3, 1.6, .5, 1) .25s both; }
.visto:nth-child(even) { animation-delay: .07s; }
@keyframes aparece { from { opacity: 0; transform: translateY(28px) rotate(-1.2deg); } }
@keyframes golpe { from { transform: scale(1.9) rotate(-18deg); opacity: 0; } }
.tag.vivo { animation: late-tag 2.4s ease-in-out infinite; }
@keyframes late-tag { 0%, 100% { transform: rotate(0); } 8% { transform: rotate(-4deg) scale(1.06); } 16% { transform: rotate(3deg); } 24% { transform: rotate(0); } }

/* combo: las fotos de sus piezas en abanico, el precio como estampa */
.combo { border: var(--borde); border-radius: 22px; background: var(--dorado); box-shadow: 6px 6px 0 var(--tinta); padding: 18px;
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: center; margin-bottom: 18px; }
.combo .abanico { display: flex; align-items: center; justify-content: center; min-height: 190px; }
.combo .pieza { width: 42%; max-width: 170px; aspect-ratio: 4 / 5; border: var(--borde); border-radius: 16px; overflow: hidden; background: var(--crema);
  box-shadow: var(--sombra); transition: transform .4s cubic-bezier(.2, 1.3, .4, 1); }
.combo .pieza img { width: 100%; height: 100%; object-fit: cover; }
.combo .pieza:nth-child(1) { transform: rotate(-8deg) translateX(10px); z-index: 1; }
.combo .pieza:nth-child(3) { transform: rotate(7deg) translateX(-10px); z-index: 2; }
.combo .pieza:nth-child(4) { transform: rotate(14deg) translateX(-34px); z-index: 3; }
.combo:hover .pieza:nth-child(1), .combo.visto .pieza:nth-child(1) { transform: rotate(-12deg) translateX(-4px); }
.combo:hover .pieza:nth-child(3), .combo.visto .pieza:nth-child(3) { transform: rotate(4deg) translateX(-2px); }
.combo .mas { position: relative; z-index: 4; flex: 0 0 auto; width: 44px; height: 44px; margin: 0 -18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--rojo); color: var(--lienzo); border: var(--borde); box-shadow: var(--sombra-chica); font-family: var(--titulo); font-size: 34px; line-height: 1; }
.combo .pieza { position: relative; }
.combo .eyebrow { font: 800 11px/1 var(--texto); letter-spacing: 1.4px; text-transform: uppercase; }
.combo h3 { font-family: var(--titulo); font-weight: 400; font-size: clamp(40px, 9vw, 64px); line-height: .9; margin: 6px 0; text-wrap: balance; }
.combo .cuanto { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.combo .cuanto .estampa { position: static; font-size: 40px; display: inline-block; }
.combo .cuanto s { font-weight: 700; color: var(--tinta-2); }
.combo .ahorro { font-weight: 900; }
.combo p { margin: 8px 0 0; font-size: 14px; font-weight: 600; }

/* ficha del producto (al tocar) */
dialog.ficha { width: min(520px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 0; border: var(--borde); border-radius: 24px;
  box-shadow: 8px 8px 0 var(--tinta); background: var(--lienzo); color: var(--tinta); overflow: auto; }
dialog.ficha::backdrop { background: rgba(29, 29, 27, .62); animation: oscurece .25s ease-out both; }
dialog.ficha[open] { animation: ficha-sube .42s cubic-bezier(.2, 1.1, .3, 1) both; }
@keyframes oscurece { from { background: rgba(29, 29, 27, 0); } }
@keyframes ficha-sube { from { transform: translateY(40px) scale(.94) rotate(-1deg); opacity: 0; } }
.ficha .foto { aspect-ratio: 1; background: var(--crema); border-bottom: var(--borde); }
.ficha .foto img { width: 100%; height: 100%; object-fit: cover; }
.ficha .cuerpo { padding: 16px 18px 20px; display: grid; gap: 10px; }
.ficha h3 { font-family: var(--titulo); font-weight: 400; font-size: 42px; line-height: .95; margin: 0; text-wrap: balance; }
.ficha p { margin: 0; color: var(--tinta-2); }
.ficha .precios { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
.precio { font-family: var(--titulo); font-size: 36px; line-height: 1; color: var(--rojo); font-variant-numeric: tabular-nums; }
.precio small { font: 700 11px var(--texto); color: var(--tinta-2); letter-spacing: .3px; margin-left: 4px; text-transform: uppercase; }
.ficha .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ficha .nota { font-size: 13px; font-weight: 700; }
.cerrar { position: absolute; top: 12px; right: 12px; width: 42px; height: 42px; border-radius: 50%; border: var(--borde); background: var(--dorado);
  font: 900 20px/1 var(--texto); color: var(--tinta); cursor: pointer; box-shadow: var(--sombra-chica); }

/* promociones: el descuento es el titular */
.promos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.promo { border: var(--borde); border-radius: var(--radio); padding: 14px 16px; background: var(--lienzo); box-shadow: var(--sombra); display: grid; gap: 6px; align-content: start; }
.promo.vivo { background: var(--dorado); }
.promo .grande { font-family: var(--titulo); font-size: 56px; line-height: .9; color: var(--rojo); }
.promo.vivo .grande { color: var(--tinta); }
.promo b { font-size: 16px; }
.promo .cuando { font-size: 13px; font-weight: 600; }
.promo .estado { font: 800 11px/1 var(--texto); letter-spacing: 1px; text-transform: uppercase; }
.promo .aplica { font-size: 12px; color: var(--tinta-2); }
.promo.vivo .aplica { color: var(--tinta); }

/* puntos */
.puntos { background: var(--tinta); color: var(--lienzo); border-radius: 22px; border: var(--borde); box-shadow: 6px 6px 0 var(--rojo); padding: 22px;
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 22px; }
.puntos h2 { font-family: var(--titulo); font-weight: 400; font-size: 52px; line-height: .9; margin: 0 0 8px; color: var(--dorado); }
.puntos ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: paso; }
.puntos li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; counter-increment: paso; }
.puntos li::before { content: counter(paso); font-family: var(--titulo); font-size: 22px; line-height: 30px; text-align: center; width: 30px; height: 30px;
  border-radius: 50%; background: var(--dorado); color: var(--tinta); }
.canjes { display: grid; gap: 10px; align-content: start; }
.canje { background: var(--lienzo); color: var(--tinta); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.canje .pts { font-family: var(--titulo); font-size: 28px; line-height: 1; color: var(--rojo); white-space: nowrap; }
.canje span { font-size: 12px; color: var(--tinta-2); display: block; }
.vacio { color: var(--tinta-2); padding: 20px 0; font-weight: 600; }

footer { border-top: var(--borde); padding-block: 22px 34px; }
footer .marco { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; }
footer b { font-family: var(--titulo); font-weight: 400; font-size: 30px; display: block; line-height: 1; }
footer p { margin: 4px 0; font-size: 13px; color: var(--tinta-2); }
footer .sello { width: 92px; height: auto; aspect-ratio: 360 / 370; transform: rotate(-8deg); }

@media (min-width: 700px) { .lista { grid-template-columns: repeat(auto-fill, minmax(220px, 280px)); gap: 22px 20px; } }
@media (min-width: 1000px) {
  .portada .wordmark { height: 56px; }
}
@media (max-width: 560px) {
  .ahora { grid-template-columns: auto minmax(0, 1fr); }
  .ahora .ir { grid-column: 1 / -1; text-align: center; }
  .puntos { grid-template-columns: minmax(0, 1fr); }
  .estampa { font-size: 26px; }
  /* las promos no deben empujar las fotos: tira horizontal que se desliza */
  .promos { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 74%; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 2px 8px 10px 2px; scrollbar-width: none; }
  .promos::-webkit-scrollbar { display: none; }
  .promo { scroll-snap-align: start; padding: 12px 14px; }
  .promo .grande { font-size: 44px; }
  .combo { grid-template-columns: minmax(0, 1fr); padding: 14px; }
  .combo .abanico { min-height: 0; padding-top: 6px; }
  .seccion h2 { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after, dialog.ficha::backdrop { animation: none !important; transition: none !important; }
  .espera { opacity: 1; transform: none; }
}
</style>
</head>

  // Hora de la sucursal (no la del celular si esta en otra zona): dia ISO 1-7, minutos del dia y fecha AAAA-MM-DD.
  function ahora() {

    var h = Number(p.hour) % 24;
    return { dia: dia, min: h * 60 + Number(p.minute), fecha: p.year + '-' + p.month + '-' + p.day, hhmm: String(h).padStart(2, '0') + ':' + p.minute };

  var aMin = function (t) { var x = String(t).split(':'); return Number(x[0]) * 60 + Number(x[1]); };

  function estado(p, a) {
    if (p.fecha_fin && a.fecha > p.fecha_fin) return { vivo: false, txt: 'Terminó' };
    if (p.fecha_inicio && a.fecha < p.fecha_inicio) return { vivo: false, txt: 'Empieza el ' + p.fecha_inicio.split('-').reverse().slice(0, 2).join('/') };
    var hoy = !p.dias_semana.length || p.dias_semana.indexOf(a.dia) >= 0;
    if (p.hora_inicio) {

    // franja AHORA
    var h = '<div class="reloj">' + a.hhmm + '<small>' + DIAS[a.dia] + '</small></div>';
    if (vivas.length) {
      var p0 = vivas[0];
      h += '<div class="que"><b><span class="punto-vivo"></span>' + esc(p0.nombre) + (vivas.length > 1 ? ' y ' + (vivas.length - 1) + ' más' : '') + '</b><span>' + esc(estado(p0, a).txt) + ' · pídela en caja</span></div><a class="ir" href="#promos">Ver promos</a>';
    } else if (pronto.length) {
      h += '<div class="que"><b>' + esc(pronto[0].nombre) + '</b><span>' + esc(estado(pronto[0], a).txt) + '</span></div><a class="ir" href="#promos">Ver promos</a>';
    } else {
      h += '<div class="que"><b>Pide en caja y junta puntos</b><span>Da tu teléfono al pagar: 1 punto por cada $' + D.pesos_por_punto + '</span></div><a class="ir" href="#puntos">Cómo funciona</a>';
    }
    $('ahora').innerHTML = h;

    // chips
    var chips = (D.promociones.length ? '<a class="chip promo" href="#promos">Promos</a>' : '') +
      D.categorias.map(function (c, k) { return '<a class="chip" style="animation-delay:' + (0.45 + k * 0.05).toFixed(2) + 's" href="#' + slug(c.nombre) + '">' + esc(c.nombre.toLowerCase()) + '</a>'; }).join('') +
      '<a class="chip" href="#puntos">Puntos</a>';
    if ($('chips').dataset.h !== chips) { $('chips').innerHTML = chips; $('chips').dataset.h = chips; }

    // contenido
    var out = '';
    if (D.promociones.length && !q) {
      var combos = D.promociones.filter(function (p) { return p.tipo === 'combo' && p.combo; });
      var resto = D.promociones.filter(function (p) { return p.tipo !== 'combo'; });
      out += '<section class="seccion" id="promos"><header><h2>Promos</h2><span>se piden en caja</span></header>' + combos.map(function (p) {
        var c = p.combo, e = estado(p, a), fotos = [];
        c.espacios.forEach(function (es, k) {
          if (k) fotos.push('<span class="mas" aria-hidden="true">+</span>');
          es.opciones.slice(0, 2).forEach(function (o) { fotos.push('<div class="pieza"><img src="' + esc(foto(o.imagen)) + '" alt="' + esc(o.nombre) + '" loading="lazy" width="480" height="600" onerror="this.onerror=null;this.src=\'' + SIN_FOTO + '\'"></div>'); });
        });
        var piezas = c.espacios.map(function (es) { return es.opciones.map(function (o) { return o.nombre; }).join(' o '); }).join(' + ');
        return '<article class="combo"><div class="abanico">' + fotos.join('') + '</div><div>' +
          '<div class="eyebrow">' + (e.vivo ? '<span class="punto-vivo"></span>Hoy · ' : esc(e.txt) + ' · ') + 'combo −' + c.pct + '%</div>' +
          '<h3>' + esc(p.nombre) + '</h3><div class="cuanto"><span class="estampa">' + (c.hasta > c.desde ? 'desde ' : '') + dinero(c.desde) + '</span><s>' + dinero(c.suelto) + '</s>' +
          '<span class="ahorro">ahorras ' + dinero(c.suelto - c.desde) + '</span></div>' +
          '<p>' + esc(piezas.charAt(0).toUpperCase() + piezas.slice(1)) + '. Pídelo en caja con tu platillo.</p></div></article>';
      }).join('') + (resto.length ? '<div class="promos">' +
        resto.slice().sort(function (x, y) { return estado(y, a).vivo - estado(x, a).vivo; }).map(function (p) {
          var e = estado(p, a);
          return '<article class="promo' + (e.vivo ? ' vivo' : '') + '"><div class="estado">' + (e.vivo ? '<span class="punto-vivo"></span>Ahora · ' : '') + esc(e.txt) + '</div>' +
            '<div class="grande">' + esc(grande(p)) + '</div><b>' + esc(p.nombre) + '</b><div class="cuando">' + esc(cuando(p)) + '</div>' +
            '<div class="aplica">En ' + esc(p.aplica_a) + (p.solo_clientes ? ' · solo clientes con puntos' : '') + '</div></article>';
        }).join('') + '</div>' : '') + '</section>';
    }
    var hay = 0;
    VISTOS = [];
    D.categorias.forEach(function (c) {
      var ps = c.productos.filter(function (p) { return !q || (p.nombre + ' ' + (p.descripcion || '') + ' ' + c.nombre).toLowerCase().indexOf(q) >= 0; });
      if (!ps.length) return;
      hay += ps.length;
      out += '<section class="seccion" id="' + slug(c.nombre) + '"><header><h2>' + esc(c.nombre) + '</h2><span>' + ps.length + (ps.length === 1 ? ' opción' : ' opciones') + '</span></header><div class="lista">' +
        ps.map(function (p) {
          var i = VISTOS.push(p) - 1;
          // en la foto solo va la promocion que aplica AHORA (o la primera), para no tapar la comida
          var prs = p.promociones.map(function (id) { return porId[id]; }).filter(Boolean);
          var viva = prs.filter(function (pr) { return estado(pr, a).vivo; })[0];
          var cinta = viva ? '<span class="tag vivo">' + esc(viva.etiqueta) + ' ahora</span>' : (prs[0] ? '<span class="tag">' + esc(prs[0].etiqueta) + '</span>' : '');
          return '<button type="button" class="prod" data-i="' + i + '" aria-label="' + esc(p.nombre) + ', ' + dinero(p.precio) + '">' +
            '<div class="marco-foto"><div class="foto"><img src="' + esc(foto(p.imagen)) + '" alt="' + esc(p.nombre) + '" loading="lazy" width="480" height="600" onerror="this.onerror=null;this.src=\'' + SIN_FOTO + '\'"></div>' +
            (cinta ? '<div class="cinta">' + cinta + '</div>' : '') + '<span class="estampa">' + dinero(p.precio) + '</span></div>' +
            '<div class="pie"><h3>' + esc(p.nombre) + '</h3>' + (eligeTxt(p) ? '<span class="elige">' + esc(eligeTxt(p)) + '</span>' : '') + (p.variante2 ? '<span class="otra">2 ingredientes ' + dinero(p.variante2.precio) + '</span>' : '') + '</div></button>';
        }).join('') + '</div></section>';
    });
    if (q && !hay) out += '<p class="vacio">No encontramos «' + esc(q) + '». Prueba con asada, cemita o refresco.</p>';
    if (!q) {
      out += '<section class="seccion" id="puntos"><div class="puntos"><div><h2>Tus compras<br>suman puntos</h2><ol>' +
        '<li><span>Da tu <b>teléfono</b> al pagar en caja.</span></li>' +
        '<li><span>Ganas <b>1 punto por cada $' + D.pesos_por_punto + '</b> que pagas.</span></li>' +
        '<li><span>Tu saldo sale en tu <b>ticket</b>. Sirven en todas las sucursales Gonzalitoz.</span></li></ol></div>' +
        '<div class="canjes">' + (D.recompensas.length ? D.recompensas.map(function (r) {
          return '<div class="canje"><div><b>' + esc(r.nombre) + '</b><span>' + esc(r.aplica_a) + '</span></div><div class="pts">' + r.puntos + ' pts</div></div>'; }).join('')
          : '<div class="canje"><div><b>Pronto: canjes</b><span>Producto gratis con tus puntos</span></div></div>') + '</div></div></section>';
    }
    $('contenido').innerHTML = out;
    espia();
    revela();
  }

  // aparicion al hacer scroll: solo esperan las tarjetas que nacen fuera de la pantalla; sin IntersectionObserver o con
  // movimiento reducido todo queda visible desde el principio
  var obsVer;
  function revela() {
    if (obsVer) obsVer.disconnect();
    if (!('IntersectionObserver' in window) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    obsVer = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.remove('espera'); e.target.classList.add('visto'); obsVer.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px' });
    var alto = window.innerHeight || 800;
    document.querySelectorAll('.prod, .combo, .promo').forEach(function (el) {
      if (el.getBoundingClientRect().top > alto) el.classList.add('espera');
      obsVer.observe(el);
    });
  }

  // categoria visible = chip activo
  var obs;
  function espia() {
    if (obs) obs.disconnect();
    if (!('IntersectionObserver' in window)) return;
    obs = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        document.querySelectorAll('.chip').forEach(function (c) {
          var on = c.getAttribute('href') === '#' + e.target.id;
          c.setAttribute('aria-current', on ? 'true' : 'false');
          if (on && c.scrollIntoView) c.parentNode.scrollTo({ left: c.offsetLeft - 16, behavior: 'smooth' });
        });
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    document.querySelectorAll('.seccion').forEach(function (s) { obs.observe(s); });
  }

  var s = D.sucursal;
  $('sucNombre').textContent = 'Sucursal ' + s.nombre;
  $('sucDir').textContent = s.direccion || '';
  $('pieNombre').textContent = 'Gonzalitoz ' + s.nombre;
  $('pieDatos').textContent = [s.direccion, s.telefono ? 'Tel. ' + s.telefono : ''].filter(Boolean).join(' · ');
  var g = new Date(D.generado);
  $('pieFecha').textContent = 'Precios en pesos mexicanos, vigentes al ' + g.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }) + '.';
  $('q').addEventListener('input', pintar);
  $('contenido').addEventListener('click', function (e) { var b = e.target.closest('.prod'); if (b) abrirFicha(VISTOS[Number(b.dataset.i)]); });
  $('ficha').addEventListener('click', function (e) { if (e.target === this) this.close(); });   // tocar fuera cierra
  pintar();
  // happy hour: cada 30 s se revisa la hora; solo se vuelve a pintar si cambio el reloj o el estado de alguna promocion
  var firma = function () { var a = ahora(); return D.promociones.map(function (p) { return estado(p, a).txt; }).join('|'); };
  var ultima = firma();
  setInterval(function () {
    var f = firma();
    if (f !== ultima) { ultima = f; pintar(); return; }
    var r = document.querySelector('.ahora .reloj'), a = ahora();
    if (r) r.firstChild.nodeValue = a.hhmm;          // solo el reloj: no se repinta el menu ni se pierde el scroll
  }, 30000);
})();
</script>
</body>
</html>
